<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DevLens | Developer Analytics & Matchmaking{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-git-icon">λ</span>
        <span>DevLens</span>
        <span class="brand-badge">git-analytics v1.0</span>
      </a>
      
      <ul class="nav-links">
        <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Directory</a></li>
        <li><a href="{{ url_for('match') }}" class="nav-link {% if request.endpoint == 'match' %}active{% endif %}">Matchmaker</a></li>
        <li>
          <div class="dataset-indicator">
            <span class="status-dot"></span>
            <span>188 Devs Indexed</span>
          </div>
        </li>
      </ul>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container" style="padding-top: 28px; padding-bottom: 40px; flex-grow: 1;">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>DevLens Developer Intelligence & Project-Fit Matchmaking System &bull; Evaluated on 188 GitHub Profiles</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
